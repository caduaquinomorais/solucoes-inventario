{% extends 'base.html' %}

{% block title %}
    Login
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5 col-lg-4">

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                Movimentações
            </h1>

            <p class="text-muted">
                Acesse sua conta
            </p>

        </div>


        <div class="card">

            <div class="card-body p-4">

                <form method="post">

                    {% csrf_token %}


                    {% if form.non_field_errors %}

                        <div class="alert alert-danger">

                            {% for error in form.non_field_errors %}
                                {{ error }}
                            {% endfor %}

                        </div>

                    {% endif %}


                    <div class="mb-3">

                        <label
                            for="{{ form.username.id_for_label }}"
                            class="form-label"
                        >
                            Usuário
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="{{ form.username.id_for_label }}"
                            class="form-control"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="{{ form.password.id_for_label }}"
                            class="form-label"
                        >
                            Senha
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="{{ form.password.id_for_label }}"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
